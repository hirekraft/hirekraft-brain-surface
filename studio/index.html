<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>The Studio Surface</title>
<!--
  THE ONE STUDIO SURFACE. This address is the only one that serves the studio.

  It carries the July layout (Workshops · Lab · Parts Bin · The Frame · Principles)
  and the IP & Docs reader, ask box and sign-in that were already proven working —
  reused verbatim, not reimplemented. Reimplementing them is how two surfaces became
  three.

  WHY HERE. An edge function on *.supabase.co/functions/v1 cannot send text/html:
  four constructions all returned text/plain, with three controls proving it a
  platform constraint (cache-control passed through, application/json from the same
  function passed through, and the same fetch path reports text/html for example.com).
  This repo is writable through Studio MCP, so the deploy path stays tracked and Alex
  is not in the loop. Retired with proof: studio-surface.netlify.app (tombstoned) and
  the GET handler on studio-july (now a pointer, not a page).

  This file holds NO studio values. Every number arrives through a POST carrying a
  real session, so an unauthenticated read of these bytes discloses nothing and there
  is nowhere for a stale copy to hide.
-->
<style>
  :root{
    --bg:#f7f6f3; --raise:#ffffff; --sunk:#f1efea;
    --hair:#e6e2da; --hair-2:#efece6;
    --ink:#191a1c; --ink-2:#52545a; --ink-3:#8c8f96; --ink-4:#b8bbc1;
    --amber:#bd6515; --amber-bg:#f6ead9; --amber-line:#e0a665;
    --green:#3f7245; --green-bg:#e8f0e8; --green-line:#9bbf9e;
    --red:#a83f37; --red-bg:#f6e4e1; --red-line:#d98e85;
    --blue:#36608f; --blue-bg:#e7eef6; --steel:#3b3f47;
    --sh-1:0 1px 2px rgba(20,18,14,.05);
    --sh-2:0 1px 3px rgba(20,18,14,.06),0 6px 20px rgba(20,18,14,.05);
    --sh-3:0 2px 10px rgba(20,18,14,.06),0 16px 50px rgba(20,18,14,.10);
    --mono:"SF Mono",ui-monospace,"Cascadia Code","Roboto Mono",Menlo,monospace;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased;letter-spacing:-0.006em}
  .wrap{max-width:1120px;margin:0 auto;padding:0 32px}
  @media(max-width:640px){.wrap{padding:0 18px}}

  .masthead{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:20px 0;border-bottom:1px solid var(--hair)}
  .brand{display:flex;align-items:center;gap:13px;min-width:0}
  .mark{width:26px;height:26px;border-radius:6px;background:var(--steel);position:relative;flex:0 0 auto;overflow:hidden}
  .mark span{position:absolute;left:6px;width:14px;height:2px;background:var(--amber)}
  .mark span:nth-child(1){top:7px}
  .mark span:nth-child(2){top:12px;background:var(--green-line);width:9px}
  .mark span:nth-child(3){top:17px;background:rgba(255,255,255,.3);width:11px}
  .brand h1{font-size:17px;font-weight:650;letter-spacing:-0.022em}
  .brand .sub{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);white-space:nowrap}
  @media(max-width:640px){.brand .sub{display:none}}
  .mhr{display:flex;align-items:center;gap:14px}
  .ip-btn{font-family:var(--mono);font-size:11px;color:var(--ink-2);background:var(--raise);border:1px solid var(--hair);padding:7px 12px;border-radius:7px;cursor:pointer;transition:.15s}
  .ip-btn:hover{border-color:var(--ink-4);box-shadow:var(--sh-1)}
  .who{font-family:var(--mono);font-size:11px;color:var(--ink-3);cursor:pointer}

  .gauges{display:flex;align-items:stretch;margin-top:16px;background:var(--raise);border:1px solid var(--hair);border-radius:9px;overflow:hidden;box-shadow:var(--sh-1);cursor:pointer;width:fit-content;max-width:100%;flex-wrap:wrap}
  .gauges:hover{box-shadow:var(--sh-2)}
  .gz{display:flex;align-items:center;gap:8px;padding:9px 15px;border-right:1px solid var(--hair-2)}
  .gz:last-child{border-right:none;padding:9px 12px}
  .gz .gdot{width:7px;height:7px;border-radius:50%}
  .gdot.ok{background:var(--green)}.gdot.warn{background:var(--amber)}.gdot.bad{background:var(--red);box-shadow:0 0 0 3px var(--red-bg)}.gdot.live{background:var(--blue)}
  .gz .gl{font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
  .gz .gv{font-family:var(--mono);font-size:11px;color:var(--ink);font-weight:600}
  .gz.alert .gv{color:var(--red)}
  .gz .chev{font-size:9px;color:var(--ink-4)}
  .gauges-detail{display:none;margin-top:8px;background:var(--raise);border:1px solid var(--hair);border-radius:9px;padding:6px;box-shadow:var(--sh-2);max-width:620px}
  .gauges-detail[data-open="true"]{display:block}
  .gd-row{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:6px}
  .gd-row:hover{background:var(--hair-2)}
  .gd-row .ddot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
  .ddot.ok{background:var(--green)}.ddot.warn{background:var(--amber)}.ddot.bad{background:var(--red)}.ddot.live{background:var(--blue)}
  .gd-row .dn{font-family:var(--mono);font-size:12px;flex:1}
  .gd-row .ds{font-family:var(--mono);font-size:11px;color:var(--ink-3)}

  nav.sections{display:flex;gap:2px;margin-top:24px;border-bottom:1px solid var(--hair);overflow-x:auto}
  .sec{font-size:13.5px;color:var(--ink-3);background:none;border:none;cursor:pointer;padding:11px 15px 14px;position:relative;font-weight:500;letter-spacing:-0.01em;white-space:nowrap;transition:.15s}
  .sec:hover{color:var(--ink-2)}
  .sec[aria-selected="true"]{color:var(--ink)}
  .sec[aria-selected="true"]::after{content:"";position:absolute;left:15px;right:15px;bottom:-1px;height:2px;background:var(--amber);border-radius:2px}

  main{padding:34px 0 90px}
  .view{display:none}.view[data-active="true"]{display:block;animation:fade .28s ease}
  @keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  .lede{color:var(--ink-2);max-width:650px;margin-bottom:4px;font-size:15px;line-height:1.6}
  .lede b{color:var(--ink);font-weight:600}

  .blk{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);margin:36px 0 14px;display:flex;align-items:center;gap:11px}
  .blk .ct{color:var(--ink-2)}.blk .ln{flex:1;height:1px;background:var(--hair)}

  /* THE LINE — instrument rail, problems dominate, health recedes */
  .rail{background:var(--raise);border:1px solid var(--hair);border-radius:10px;overflow:hidden;box-shadow:var(--sh-1)}
  .row{display:grid;grid-template-columns:3px 260px 1fr auto auto;align-items:center;gap:15px;padding:11px 16px 11px 13px;border-bottom:1px solid var(--hair-2);transition:.12s}
  .row:last-child{border-bottom:none}
  .row .edge{width:3px;height:30px;border-radius:2px;background:transparent}
  .row .nm{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);word-break:break-all}
  .row .nm small{display:block;color:var(--ink-4);font-size:10.5px;margin-top:1px;font-family:var(--sans)}
  .row .st{font-size:12.5px;color:var(--ink-3)}
  .row .gg{font-family:var(--mono);font-size:10.5px;color:var(--ink-4);white-space:nowrap}
  .row .md{font-family:var(--mono);font-size:9px;letter-spacing:.05em;padding:2px 6px;border-radius:4px;background:var(--sunk);color:var(--ink-4)}
  .row.ok{opacity:.6}.row.ok:hover{opacity:1;background:var(--hair-2)}.row.ok .edge{background:var(--green-line)}
  .row.off{opacity:.48}.row.off:hover{opacity:.85;background:var(--hair-2)}.row.off .edge{background:var(--ink-4)}.row.off .nm{color:var(--ink-3)}
  .row.bad{opacity:1;background:linear-gradient(90deg,var(--red-bg) 0%,transparent 55%)}.row.bad .edge{background:var(--red)}.row.bad .nm{color:var(--ink);font-weight:600}.row.bad .st{color:var(--red);font-weight:500}
  .row.warn .edge{background:var(--amber-line)}.row.warn .st{color:var(--amber)}
  @media(max-width:640px){.row{grid-template-columns:3px 1fr auto}.row .st,.row .gg{display:none}}

  /* WORK ORDERS */
  .orders{background:var(--raise);border:1px solid var(--hair);border-radius:11px;overflow:hidden;box-shadow:var(--sh-2)}
  .ord{padding:20px 22px;border-bottom:1px solid var(--hair-2);display:grid;grid-template-columns:30px 1fr auto;gap:0 18px;transition:.14s}
  .ord:last-child{border-bottom:none}
  .ord:hover{background:#fdfcfa}
  .ord .seq{font-family:var(--mono);font-size:11px;color:var(--ink-4);grid-row:1/span 4;padding-top:3px}
  .ord .ti{font-size:15.5px;font-weight:600;letter-spacing:-0.015em;grid-column:2;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .chip{font-family:var(--mono);font-size:8.5px;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:5px;font-weight:600;white-space:nowrap}
  .chip.high{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-line)}
  .chip.stale{background:var(--red-bg);color:var(--red);border:1px solid var(--red-line)}
  .chip.norm{background:var(--sunk);color:var(--ink-3);border:1px solid var(--hair)}
  .ord .tg{grid-column:2;display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 9px}
  .tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.02em;padding:2px 7px;border-radius:4px;background:var(--sunk);color:var(--ink-3)}
  .ord .wy{grid-column:2;color:var(--ink-2);font-size:13.5px;line-height:1.55;max-width:560px}
  .ord .fx{grid-column:2;font-size:13px;color:var(--ink);margin-top:10px;padding:11px 13px;background:var(--sunk);border-radius:7px;max-width:560px}
  .ord .fx b{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--amber);display:block;margin-bottom:3px}
  .ord .act{grid-column:3;grid-row:1/span 4;display:flex;flex-direction:column;gap:7px;align-self:start;padding-top:1px}
  .btn{font-family:var(--mono);font-size:10.5px;padding:8px 12px;border-radius:6px;border:1px solid var(--hair);background:var(--raise);color:var(--ink-2);cursor:pointer;white-space:nowrap;text-align:left;transition:.14s}
  .btn:hover{border-color:var(--amber);color:var(--amber)}
  .btn.pri{background:var(--steel);color:#fff;border-color:var(--steel)}
  .btn.pri:hover{background:var(--amber);border-color:var(--amber)}
  .btn:disabled{opacity:.55;cursor:default}
  @media(max-width:640px){.ord{grid-template-columns:1fr}.ord .seq{display:none}.ord .ti,.ord .tg,.ord .wy,.ord .fx{grid-column:1}.ord .act{grid-column:1;grid-row:auto;flex-direction:row;margin-top:12px}}

  /* PARTS */
  .stock{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:8px}
  .pt{background:var(--raise);border:1px solid var(--hair);border-radius:7px;padding:12px 13px;border-left:3px solid var(--hair);transition:.13s}
  .pt:hover{box-shadow:var(--sh-1)}
  .pt.stocked{border-left-color:var(--green-line)}.pt.lab{border-left-color:var(--amber-line)}
  .pt.sourced{border-left-color:#8fb0d6}.pt.specific{border-left-color:#bd9bb8}
  .pt .pn{font-family:var(--mono);font-size:12px;color:var(--ink);margin-bottom:5px;line-height:1.3}
  .pt .pd{font-size:11.5px;color:var(--ink-3);line-height:1.4}
  .pt .ps{font-family:var(--mono);font-size:8.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-4);display:block;margin-top:6px}

  /* FRAME */
  .fr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:1px;background:var(--hair);border:1px solid var(--hair);border-radius:10px;overflow:hidden}
  .fc{background:var(--raise);padding:19px 20px}
  .fc h3{font-size:14.5px;font-weight:600;letter-spacing:-0.01em;margin-bottom:6px}
  .fc p{font-size:13px;color:var(--ink-2);line-height:1.5}
  .fc .pill{display:inline-block;font-family:var(--mono);font-size:9.5px;color:var(--green);background:var(--green-bg);padding:2px 7px;border-radius:4px;margin-top:9px}

  /* PRINCIPLES */
  .lab-card{background:var(--raise);border:1px solid var(--hair);border-radius:9px;padding:16px 18px;box-shadow:var(--sh-1);margin-bottom:9px;border-left:3px solid var(--amber-line)}
  .lab-card .lc-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:4px}
  .lab-card .lc-name{font-weight:600;font-size:14.5px}
  .lab-card .lc-meta{font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
  .lab-card .lc-body{color:var(--ink-2);font-size:13.5px;line-height:1.55;white-space:pre-wrap}
  .lab-note{font-family:var(--mono);font-size:11px;color:var(--ink-3);line-height:1.6;margin-top:6px}
  /* principle index + composed deep view */
  .pidx{columns:2;column-gap:14px}
  @media(max-width:640px){.pidx{columns:1}}
  .pg{break-inside:avoid;margin-bottom:14px;background:var(--raise);border:1px solid var(--hair);border-radius:9px;padding:15px 17px}
  .pi{font-size:12.5px;color:var(--ink-2);margin:0 -8px;padding:5px 8px;border-radius:6px;display:flex;gap:9px;cursor:pointer;transition:.12s;line-height:1.4}
  .pi:hover{background:var(--hair-2);color:var(--ink)}
  .pi .pn{font-family:var(--mono);color:var(--amber);font-size:10.5px;flex:0 0 auto;width:22px;text-align:right}
  .pdepth{background:var(--raise);border:1px solid var(--hair);border-left:3px solid var(--amber);border-radius:9px;padding:22px 24px;margin-bottom:20px;box-shadow:var(--sh-2)}
  .pdepth .gen{font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--amber);margin-bottom:11px;display:flex;align-items:center;gap:7px}
  .pdepth h3{font-size:17px;font-weight:600;letter-spacing:-0.02em;margin-bottom:8px}
  .pdepth .ds{margin-bottom:13px}
  .pdepth .ds b{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);display:block;margin-bottom:3px}
  .pdepth .ds p{font-size:13.5px;color:var(--ink);line-height:1.55;white-space:pre-wrap}
  .pdepth .ft{font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-top:14px;padding-top:12px;border-top:1px solid var(--hair-2)}
  /* evidence collapsed by default; a citation opens the one it supports */
  .ev{background:var(--raise);border:1px solid var(--hair);border-radius:9px;margin-bottom:7px;overflow:hidden}
  .ev>summary{cursor:pointer;list-style:none;padding:11px 14px;display:flex;gap:10px;align-items:baseline}
  .ev>summary::-webkit-details-marker{display:none}
  .ev>summary:hover{background:var(--hair-2)}
  .ev .er{font-family:var(--mono);font-size:10.5px;color:var(--amber);flex:0 0 auto;width:26px}
  .ev .ek{font-family:var(--mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);flex:0 0 auto}
  .ev .en{font-size:12.5px;color:var(--ink-2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ev .em{font-family:var(--mono);font-size:10px;color:var(--ink-4);flex:0 0 auto}
  .ev .eb{padding:0 14px 14px 50px;white-space:pre-wrap;font-size:12.5px;line-height:1.6;color:var(--ink-2)}
  .ev[open]{border-color:var(--amber-line)}
  .ev.hit{border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-bg)}
  .cite{font-family:var(--mono);font-size:10.5px;color:var(--amber);background:var(--amber-bg);border:1px solid var(--amber-line);border-radius:4px;padding:0 4px;cursor:pointer;white-space:nowrap}
  .cite:hover{background:var(--amber);color:#fff}
  .ansbody{font-size:15px;line-height:1.62;white-space:pre-wrap}
  .ansbody p{margin-bottom:11px}
  /* the path — the only sequencing claim the corpus asserts */
  .steps{position:relative;margin-top:14px}
  .step{display:flex;gap:16px;padding-bottom:14px}
  .step .no{flex:none;width:42px;height:42px;border-radius:50%;background:var(--raise);border:2px solid var(--hair);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;color:var(--ink-2)}
  .step .sb{flex:1;background:var(--raise);border:1px solid var(--hair);border-radius:11px;padding:13px 16px;min-width:0}
  .step .ti2{font-weight:600;font-size:14.5px;letter-spacing:-.01em}
  .step .de{font-size:13px;color:var(--ink-2);margin-top:5px;line-height:1.5}
  .step .ga{font-size:12.5px;color:var(--ink);margin-top:9px;padding:9px 12px;background:var(--sunk);border-radius:7px}
  .step .ga b{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--amber);display:block;margin-bottom:3px}
  .step .ga.none{color:var(--ink-3)}
  .lab-hd{display:flex;align-items:center;gap:12px;background:var(--raise);border:1px solid var(--hair);border-radius:10px;padding:14px 18px;box-shadow:var(--sh-1);flex-wrap:wrap}
  .lab-hd .ldot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--green-bg)}
  .lab-hd .lt{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
  .lab-hd .lt b{color:var(--green)}
  .lab-hd .lr{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-4)}

  .foot{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-top:30px;padding-top:15px;border-top:1px solid var(--hair);line-height:1.6}

  /* IP & DOCS — the reader, reused as proven: open in place, download,
     and the delivered size shown against the claimed size so a truncated
     body reads as a mismatch instead of passing as the document. */
  .ov{position:fixed;inset:0;background:rgba(25,26,28,.3);backdrop-filter:blur(2px);display:none;z-index:40}
  .ov[data-open="true"]{display:block}
  .dr{position:fixed;top:0;right:0;height:100%;width:720px;max-width:96vw;background:var(--bg);border-left:1px solid var(--hair);transform:translateX(100%);transition:transform .26s cubic-bezier(.4,0,.2,1);z-index:41;overflow-y:auto;padding:24px 22px 50px;box-shadow:var(--sh-3)}
  .ov[data-open="true"] .dr{transform:none}
  .dr h2{font-size:15px;font-weight:600;display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
  .dr .x{background:none;border:none;color:var(--ink-3);cursor:pointer;font-size:21px;line-height:1}
  .dr .dl{color:var(--ink-3);font-size:12px;margin-bottom:20px;line-height:1.5}
  .iprow{display:block;background:var(--raise);border:1px solid var(--hair);border-radius:7px;padding:12px 14px;margin-bottom:7px;transition:.14s;cursor:pointer}
  .iprow:hover{border-color:var(--amber);box-shadow:var(--sh-1)}
  .iprow .rt{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .iprow .rn{font-family:var(--mono);font-size:12px;color:var(--ink)}
  .iprow .rw{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);white-space:nowrap}
  .iprow .rd{font-size:12px;color:var(--ink-3);margin-top:3px}
  .docbody{white-space:pre-wrap;font-family:var(--mono);font-size:12.5px;line-height:1.62;background:var(--raise);border:1px solid var(--hair);border-radius:9px;padding:16px;max-height:62vh;overflow:auto;margin-top:10px}
  .drow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
  .mismatch{color:var(--red);font-weight:600}

  /* SIGN IN — absent from the document until a session verifies */
  .gate{max-width:360px;margin:16vh auto 0;padding:0 22px}
  .gate .gm{display:flex;align-items:center;gap:12px;margin-bottom:22px}
  .gate h1{font-size:17px;font-weight:650;letter-spacing:-0.022em}
  .gate .gs{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-top:2px}
  .gate label{font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);display:block;margin:14px 0 5px}
  .gate input{width:100%;background:var(--raise);border:1px solid var(--hair);border-radius:7px;padding:10px 12px;font-family:var(--sans);font-size:14px;color:var(--ink);outline:none}
  .gate input:focus{border-color:var(--amber)}
  .gate .go{width:100%;margin-top:18px;background:var(--steel);color:#fff;border:1px solid var(--steel);border-radius:7px;padding:11px;font-family:var(--mono);font-size:11.5px;cursor:pointer;transition:.14s}
  .gate .go:hover{background:var(--amber);border-color:var(--amber)}
  .gate .go:disabled{opacity:.55;cursor:default}
  .gate .msg{font-family:var(--mono);font-size:11px;line-height:1.6;margin-top:14px;color:var(--ink-3)}
  .gate .msg.bad{color:var(--red)}

<body>
<div id="root"></div>
<script>
const FN   = "https://yzsudnjwqplaaiwxbusi.supabase.co/functions/v1/studio-july";

const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tok    = () => { try{ return localStorage.getItem("studio_token")||""; }catch{ return ""; } };
const setTok = t  => { try{ t?localStorage.setItem("studio_token",t):localStorage.removeItem("studio_token"); }catch{} };
let D=null, DOCS=[];

/* Every call ends in a stated outcome. A silent form is indistinguishable from
   never having tried, which is the failure this estate has paid for repeatedly. */
async function call(url,body,auth){
  const c=new AbortController(); const t=setTimeout(()=>c.abort(),20000);
  try{
    const r=await fetch(url,{method:"POST",signal:c.signal,
      headers:Object.assign({"content-type":"application/json"},(auth!==false&&tok())?{authorization:"Bearer "+tok()}:{}),
      body:JSON.stringify(body)});
    const txt=await r.text(); let j={}; try{ j=JSON.parse(txt); }catch{ j={error:txt.slice(0,200)}; }
    return {status:r.status, body:j};
  }catch(e){
    return {status:0, body:{error:(e&&e.name==="AbortError")?"No answer within 20 seconds.":"Could not reach the studio."}};
  }finally{ clearTimeout(t); }
}

/* The gate. The surface is ABSENT from the document until a session verifies —
   nothing below is written into the DOM before that, and no value ships in these
   bytes. Sign-in delegates to studio-path, which already mints and refreshes the
   session against the same GoTrue identity and the same allowlist. */
function gate(msg,bad){
  root.innerHTML = '<div class="gate">'
    + '<div class="gm"><div class="mark"><span></span><span></span><span></span></div>'
    + '<div><h1>The Studio Surface</h1><div class="gs">customer one · the factory floor</div></div></div>'
    + '<label for="e">email</label><input id="e" type="email" autocomplete="username"/>'
    + '<label for="p">password</label><input id="p" type="password" autocomplete="current-password"/>'
    + '<button class="go" id="go">sign in</button>'
    + '<div class="msg '+(bad?"bad":"")+'" id="m">'+esc(msg||"")+'</div></div>';
  const go=document.getElementById("go");
  const submit=async()=>{
    go.disabled=true; const m=document.getElementById("m");
    m.className="msg"; m.textContent="checking…";
    const r=await call(PATH,{action:"signin_password",
      email:document.getElementById("e").value.trim(),
      password:document.getElementById("p").value},false);
    if(r.status===200 && r.body.ok && r.body.access_token){ setTok(r.body.access_token); return boot(); }
    gate(r.body.message||r.body.error||("that did not sign in ("+r.status+")"),true);
  };
  go.onclick=submit;
  document.getElementById("p").onkeydown=e=>{ if(e.key==="Enter") submit(); };
}

async function boot(){
  if(!tok()) return gate("");
  root.innerHTML='<div class="gate"><div class="msg">reading both brains at source…</div></div>';
  const [j,dl]=await Promise.all([call(FN,{action:"july"}),call(FN,{action:"docs"})]);
  if(j.status===401){ setTok(""); return gate("Your session ended. Sign in again.",true); }
  if(j.status!==200){ return gate(j.body.error||("could not read the studio ("+j.status+")"),true); }
  D=j.body; DOCS=(dl.status===200&&dl.body.ok)?(dl.body.documents||[]):[];
  render();
}

function gaugeBits(){

    ["capture",f.capture.days,f.capture.means]];
  const worst=Math.max.apply(null,legs.map(l=>Number(l[1])||0));
  const cls=d=>d>3?"bad":d>1.5?"warn":"ok";
  return {legs,worst,cls};
}

/* THE CLOCK, two facts side by side. The wall clock is for orientation only: a stale
   page shows a perfectly live one, which is exactly what the old surface did with a
   hardcoded "live · America/Los_Angeles · Jun 19". What actually answers "is this page
   being generated now" is the age of the server's as_of stamp, so both are shown and
   only the second is load-bearing. */
function startClock(){
  if(window.__clk) clearInterval(window.__clk);
  const tz=(Intl.DateTimeFormat().resolvedOptions().timeZone)||"local";
  const gen=Date.parse(D.as_of);
  const tick=()=>{
    const c=document.getElementById("clk"), a=document.getElementById("genage");
    if(!c||!a){ clearInterval(window.__clk); return; }
    const now=new Date();
    c.textContent=now.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",second:"2-digit"})
      +" · "+tz+" · "+now.toLocaleDateString([],{month:"short",day:"numeric"});
    if(!isFinite(gen)){ a.textContent="unknown"; a.style.color="var(--red)"; return; }
    const s=Math.max(0,Math.round((Date.now()-gen)/1000));
    a.textContent = s<90 ? s+"s ago" : s<5400 ? Math.round(s/60)+"m ago" : Math.round(s/3600)+"h ago";
    a.style.color = s>900 ? "var(--red)" : "";
  };
  tick(); window.__clk=setInterval(tick,1000);
}

/* THE PATH. The old surface showed four workshop stages (01 Ingestion → 04 Factory)
   and said Ingestion was open with the rest sequenced behind it. Nothing in the corpus
   asserted that, so it is gone. Principle 90 is the only sequencing claim the record
   makes, and it is parsed from the principle itself — if the principle is rewritten,
   this follows it. Steps that state no gate say so rather than being given one. */
function pathBlock(){

  if(!p||!p.steps||!p.steps.length)
    return '<div class="blk">The path<span class="ln"></span></div><div class="empty">The path could not be read from the corpus just now. Nothing is claimed about the order of work.</div>';
  return '<div class="blk">The path <span class="ct">'+p.steps.length+' steps</span><span class="ln"></span></div>'
  + '<div class="lab-note" style="margin-bottom:6px">'+esc(p.source)+' · '+esc(p.ordering)+'</div>'
  + '<div class="lab-note" style="margin-bottom:10px">'+esc(p.note||"")+'</div>'
  + '<div class="steps">'+p.steps.map(s=>'<div class="step"><div class="no">'+esc(s.n)+'</div><div class="sb">'
    + '<div class="ti2">'+esc(s.title)+'</div>'
    + '<div class="de">'+esc(s.detail)+'</div>'
    + (s.gate?'<div class="ga"><b>Gate — a proof, not a milestone</b>'+esc(s.gate)+'</div>'
            :'<div class="ga none"><b>Gate</b>The principle states no gate for this step.</div>')
    + '</div></div>').join("")+'</div>';
}

/* Work orders group by subsystem — a real column on promise_ledger. The four
   workshop stages the old surface grouped by were authored and are gone. */
function groupBySubsystem(wo){
  const key=o=>((o.tg&&o.tg[0])?String(o.tg[0]):"unassigned");
  return wo.slice().sort((a,b)=>{
    const ka=key(a), kb=key(b);
    if(ka!==kb) return ka<kb?-1:1;
    const rank={stale:0,high:1,norm:2};
    return (rank[a.pl]==null?9:rank[a.pl])-(rank[b.pl]==null?9:rank[b.pl]);
  });
}

/* THE PRINCIPLE DEEP VIEW. The old surface printed "brain composed this view ·
   generated from memory" over a hardcoded map of four fields per principle. This one
   actually composes: the principle's current text, the decisions citing it oldest
   first, and the other sections enforcing it. Where the record has nothing it says so
   — 26 of the 95 principles are cited by number, and the rest are honestly empty. */
/* Citations are markers in the composed text. Turn them into controls that OPEN the
   evidence they support, so a reader never hunts for [E9] down a page of passages. */
function firstLine(t){
  const s=String(t||"").replace(/\s+/g," ").trim();
  return s.length>90 ? s.slice(0,90).replace(/\s+\S*$/,"")+"…" : s;
}
function citeHTML(text){
  return esc(String(text||"")).replace(/\[(E|D)(\d+)\]/g,
    (m,k,i)=>'<span class="cite" data-cite="'+k+i+'">['+k+i+']</span>');
}
function bindCites(scope){
  (scope||document).querySelectorAll(".cite").forEach(el=>{
    el.onclick=()=>{
      const t=document.getElementById("cite-"+el.dataset.cite);
      if(!t) return;
      t.open=true;
      t.classList.add("hit");
      t.scrollIntoView({behavior:"smooth",block:"center"});
      setTimeout(()=>t.classList.remove("hit"),1600);
    };
  });
}

function bindPrinciples(){
  document.querySelectorAll(".pi").forEach(el=>{
    el.onclick=()=>openPrinciple(Number(el.dataset.n));
  });
}

/* The point first, in plain words. The exact wording and the decisions behind it sit
   underneath, collapsed — reachable, never poured into the middle of the explanation. */
async function openPrinciple(n){
  const el=document.getElementById("pdepth"); if(!el) return;
  el.innerHTML='<div class="pdepth"><div class="gen"><span class="gdt"></span>reading the record…</div></div>';
  el.scrollIntoView({behavior:"smooth",block:"nearest"});
  const r=await call(FN,{action:"principle",n:n});
  if(r.status!==200||!r.body||r.body.ok===false){
    el.innerHTML='<div class="pdepth"><div class="ds"><p>'+esc((r.body&&r.body.error)||("Failed ("+r.status+")"))+'</p></div></div>';
    return;
  }
  const d=r.body;
  const dec=d.decisions||[];
  const decBlocks=dec.map(t=>'<details class="ev" id="cite-'+esc(t.ref)+'"><summary>'
      + '<span class="er">['+esc(t.ref)+']</span><span class="ek">decision</span>'
      + '<span class="en">'+esc(firstLine(t.why))+'</span>'
      + '<span class="em">'+esc(String(t.on||"").slice(0,10))+'</span></summary>'
      + '<div class="eb">'+esc(t.why)+'</div></details>').join("");

  el.innerHTML='<div class="pdepth">'
    + '<div class="gen"><span class="gdt"></span>'+(d.mode==="explained"?"in plain words · the exact wording is below":"shown as written")+'</div>'
    + '<h3>'+esc(d.n)+' — '+esc(d.name)+'</h3>'
    + (d.mode==="explained"
        ? '<div class="ds"><b>What it says</b><div class="ansbody">'+citeHTML(d.plain)+'</div></div>'
        + (d.why?'<div class="ds"><b>Why it exists</b><div class="ansbody">'+citeHTML(d.why)+'</div></div>':'')
      : '')
    + '<details class="ev" style="margin-top:10px"><summary><span class="er">§</span><span class="ek">verbatim</span>'
    +   '<span class="en">The principle exactly as written</span></summary>'
    +   '<div class="eb">'+esc(d.text)+'</div></details>'
    + (dec.length
       ? '<div class="ds" style="margin-top:14px"><b>The decisions behind it</b>'+decBlocks+'</div>'
       : '<div class="ds" style="margin-top:14px"><b>The decisions behind it</b><p style="color:var(--ink-3);font-size:13px">'+esc(d.trail_note||"No decision in the record cites this principle by number.")+'</p></div>')
    + '<div class="ft">'+esc(d.how||"")+'</div>'
    + '</div>';
  bindCites(el);
}

async function doAsk(){
  const qi=document.getElementById("q"); const q=qi.value.trim(); if(!q) return;
  const b=document.getElementById("askb"); const a=document.getElementById("ans");
  b.disabled=true; b.textContent="Reading…";
  a.innerHTML='<div class="lab-note">Reading decisions, seat reports and doctrine…</div>';
  const r=await call(FN,{action:"ask",q:q});
  b.disabled=false; b.textContent="Ask";
  if(r.status!==200){ a.innerHTML='<div class="empty">'+esc(r.body.error||("Failed ("+r.status+")"))+'</div>'; return; }
  /* Rendered against the shape the DEPLOYED function returns, read from
     pg_get_functiondef rather than guessed from one call. This renderer was wrong twice:
     first written for {trail}, then still wrong because surface_ask actually returns four
     arrays. It is now keyed on `mode`, which the server sets to what genuinely happened,
     so the screen cannot call retrieval an answer. Any unrecognised mode says so instead
     of dumping the object. */
  const d=r.body||{};
  const note = d.how ? '<div class="lab-note" style="margin-bottom:10px">'+esc(d.how)+'</div>' : '';
  /* Collapsed by default. Twelve open passages bury a four-paragraph answer, and by
     [E9] the reader has lost which claim it supported. Each carries an id its citation
     opens directly. */
  const cites = (d.passages||[]).map(p=>'<details class="ev" id="cite-'+esc(p.ref)+'"><summary>'
      + '<span class="er">['+esc(p.ref)+']</span>'
      + '<span class="ek">'+esc(p.kind)+'</span>'
      + '<span class="en">'+esc(p.name)+'</span>'
      + '<span class="em">'+esc(p.date)+'</span></summary>'
      + '<div class="eb">'+esc(p.text)+'</div></details>').join("");

  if(d.mode==="answered"){
    a.innerHTML='<div class="pdepth"><div class="gen"><span class="gdt"></span>answered from the record</div>'
      + '<div class="ansbody">'+citeHTML(d.answer)+'</div>'
      + '<div class="ft">'+esc(d.how)+'</div></div>'
      + '<div class="blk">The evidence <span class="ct">'+(d.passages||[]).length+' · click a citation to open one</span><span class="ln"></span></div>'+cites;
    bindCites(a);
    return;
  }
  if(d.mode==="retrieved"){
    a.innerHTML='<div class="blk">What the record says about this <span class="ct">'+(d.passages||[]).length+'</span><span class="ln"></span></div>'
      + note + cites;
    return;
  }
  if(d.mode==="nothing_retrieved"){ a.innerHTML='<div class="empty">'+esc(d.how)+'</div>'; return; }
  if(d.mode==="text_search_fallback"){
    const f=d.fallback||{};
    const rows=[].concat(
      (f.decisions||[]).map(x=>({k:"decision",   on:x.on,     t:x.what})),
      (f.open_items||[]).map(x=>({k:"open item", on:x.raised, t:x.item})),
      (f.promises||[]).map(x=>({k:"promise "+(x.verdict||""), on:"", t:x.promise})),
      (f.dissolved||[]).map(x=>({k:"dissolved",  on:"",        t:x.stands})));
    a.innerHTML='<div class="empty" style="margin-bottom:10px">'+esc(d.how)+'</div>'
      + (rows.length ? rows.map(x=>'<div class="lab-card"><div class="lc-top"><span class="lc-name">'+esc(x.k)+'</span>'
          + '<span class="lc-meta">'+esc(String(x.on||"").slice(0,10))+'</span></div>'
          + '<div class="lc-body">'+esc(x.t)+'</div></div>').join("")
        : '<div class="empty">No word match either.</div>');
    return;
  }
  a.innerHTML='<div class="empty">The ask returned a shape this screen does not recognise'
    + (d.mode?' (mode: '+esc(d.mode)+')':'')+'. Nothing is claimed about it.</div>';
}

/* IP & Docs — listing is not opening. The list carries the claimed size; opening
   shows the delivered size beside it, and flags a mismatch rather than letting a
   truncated body pass as the document. */
function ipdocs(){
  return '<h2>IP &amp; Docs <button class="x" id="drx">×</button></h2>'
  + '<div class="dl">Everything Studio owns, served from the brain. Version, size and shard state read at this moment — never from a list.</div>'
  + '<div id="doclist">'+(DOCS.length
      ? DOCS.map((d,i)=>'<div class="iprow" data-i="'+i+'"><div class="rt">'
        + '<span class="rn">'+esc(String(d.doc_type).replace(/_/g," "))+'</span>'
        + '<span class="rw">v'+esc(d.version)+'</span></div>'
        + '<div class="rd">'+Number(d.chars).toLocaleString()+' characters · written '+esc(String(d.updated_at||"").slice(0,10))+' · click to read</div></div>').join("")
      : '<div class="empty">The document list did not load. Nothing is claimed about it.</div>')
  + '</div><div id="reader"></div>';
}

function bindDocs(){
  const x=document.getElementById("drx");
  if(x) x.onclick=()=>{ document.getElementById("ov").dataset.open="false"; };
  document.querySelectorAll("#doclist .iprow").forEach(el=>{
    el.onclick=()=>openDoc(DOCS[Number(el.dataset.i)]);
  });
}

async function openDoc(d){
  const rd=document.getElementById("reader");
  rd.innerHTML='<div class="lab-note">Fetching '+esc(d.doc_type)+'…</div>';
  const r=await call(FN,{action:"doc",doc_type:d.doc_type});
  if(r.status!==200||!r.body.ok){
    rd.innerHTML='<div class="empty">Could not open it: '+esc(r.body.error||r.status)+'</div>'; return;
  }
  const doc=r.body.doc;
  const claimed=Number(d.chars), delivered=Number(doc.chars);
  const mism = claimed!==delivered;
  rd.innerHTML='<div class="drow"><b>'+esc(doc.doc_type)+' v'+esc(doc.version)+'</b>'
    + '<span class="lab-note" style="margin:0">'+delivered.toLocaleString()+' characters delivered'
    + (mism?' <span class="mismatch">· listed '+claimed.toLocaleString()+' — MISMATCH</span>':' · matches the listed size')+'</span>'
    + '<button class="btn" id="dl">Download .md</button>'
    + '<button class="btn" id="dclose">Close</button></div>'
    + '<div class="docbody">'+esc(doc.body)+'</div>';
  document.getElementById("dclose").onclick=()=>{ rd.innerHTML=""; };
  document.getElementById("dl").onclick=()=>{
    const blob=new Blob([doc.body],{type:"text/markdown;charset=utf-8"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=doc.doc_type+"-v"+doc.version+".md";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  };
}

boot();
