<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>The studio</title>
<!--
  THE STUDIO SURFACE — one screen.

  It was twelve sections and seven tabs: legitimate measurements, all of them, and the most
  pre-AI artifact in the estate. Alex opens it for two things — where do I stand, what needs
  me — so those are the only things on it. Everything else is still measured and still
  honest; it is reached by asking rather than by being displayed permanently.

  THE QUIET STATE IS NEVER AN ABSENCE. A blank screen on a good day cannot be told apart
  from a screen whose checkers never ran, which is the estate's own defect class: a monitor
  going green because nothing is arriving. So the top line always states what was examined,
  when, and that it holds. Anything failing promotes itself there unasked, so he never has
  to know to ask. Coverage is always visible: how much of the instrument is actually
  watching, derived, so it falls on its own as markers land.

  Design: prose in a text face, measured values in mono, so a reader knows instantly whether
  they are looking at a fact or an explanation. Colour appears only in the status marks.
  Space does the grouping; no cards, no rules, no icons, no framework, no animation.
-->
<style>
  :root{
    --paper:#FCFCFA; --ink:#16181A; --muted:#5C6066; --faint:#8E9298; --hair:#E3E3DF;
    --holds:#2F6B3F; --fails:#A32D24; --unknown:#8A6A1F;
    --prose:Georgia,"Iowan Old Style","Times New Roman",serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--paper);color:var(--ink);font-family:var(--prose);
       font-size:17px;line-height:1.62;padding:5rem 1.5rem 7rem}
  .wrap{max-width:34rem;margin:0 auto}          /* ~70 characters of prose */
  .wide{max-width:44rem;margin:0 auto}

  /* the standing line: the one place boldness is spent */
  .standing{font-size:1.55rem;line-height:1.4;letter-spacing:-0.011em}
  .standing .mark{font-family:var(--mono);font-size:.95rem;letter-spacing:0}
  .quiet{color:var(--muted)}
  .val{font-family:var(--mono);font-size:.92em;font-variant-numeric:tabular-nums}

  .mark{display:inline-block;width:.5rem;height:.5rem;border-radius:50%;
        vertical-align:.08em;margin-right:.55rem}
  .m-holds{background:var(--holds)} .m-fails{background:var(--fails)}
  .m-unknown{background:var(--unknown)}

  section{margin-top:3.25rem}
  h2{font-size:1rem;font-weight:400;color:var(--faint);letter-spacing:.01em;margin-bottom:.9rem}
  .item{margin-bottom:1.15rem}
  .item p{margin-top:.15rem;color:var(--muted);font-size:.95rem}
  .row{display:flex;gap:.75rem;align-items:baseline;margin-bottom:.5rem}
  .row .what{flex:1}
  .row .value{font-family:var(--mono);font-size:.85rem;color:var(--muted);
              font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}

  a.plain,button.plain{font:inherit;font-size:.95rem;color:var(--ink);background:none;
    border:0;border-bottom:1px solid var(--hair);padding:0 0 1px;cursor:pointer}
  a.plain:hover,button.plain:hover{border-bottom-color:var(--ink)}
  button.plain:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

  form{display:flex;gap:.75rem;margin-top:.6rem}
  input{flex:1;font:inherit;font-size:1rem;background:transparent;color:var(--ink);
        border:0;border-bottom:1px solid var(--hair);padding:.35rem 0}
  input::placeholder{color:var(--faint)}
  input:focus{border-bottom-color:var(--ink);outline:none}

  .answer{margin-top:1.25rem;font-size:.98rem}
  .answer .src{font-family:var(--mono);font-size:.78rem;color:var(--faint);margin-top:.15rem}
  .note{font-size:.85rem;color:var(--faint);margin-top:.6rem}
  .fail{color:var(--fails)}
  details{margin-top:.5rem}
  summary{cursor:pointer;color:var(--muted);font-size:.92rem}
  summary::marker{color:var(--faint)}
  .body{white-space:pre-wrap;font-family:var(--mono);font-size:.8rem;line-height:1.6;
        color:var(--muted);margin-top:.6rem}
  hr{border:0;border-top:1px solid var(--hair);margin:2.5rem 0 0}
  @media (prefers-reduced-motion:no-preference){}
</style>
</head>
<body>
<div id="root" class="wrap"></div>
<script>
const FN="https://yzsudnjwqplaaiwxbusi.supabase.co/functions/v1/studio-brief";
const PATH="https://yzsudnjwqplaaiwxbusi.supabase.co/functions/v1/studio-path";
const root=document.getElementById("root");
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tok=()=>{try{return localStorage.getItem("studio_token")||""}catch{return""}};
const setTok=t=>{try{t?localStorage.setItem("studio_token",t):localStorage.removeItem("studio_token")}catch{}};
let B=null;

async function call(url,body,auth){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),25000);
  try{
    const r=await fetch(url,{method:"POST",signal:c.signal,
      headers:Object.assign({"content-type":"application/json"},(auth!==false&&tok())?{authorization:"Bearer "+tok()}:{}),
      body:JSON.stringify(body)});
    const txt=await r.text(); let j={}; try{j=JSON.parse(txt)}catch{j={error:txt.slice(0,200)}}
    return {status:r.status,body:j};
  }catch(e){
    return {status:0,body:{error:(e&&e.name==="AbortError")?"No answer within 25 seconds.":"Could not reach the studio."}};
  }finally{clearTimeout(t)}
}

/* Sign-in is the only thing in the document until a session verifies. */
function gate(msg,bad){
  root.innerHTML='<p class="standing">The studio.</p>'
    +'<form id="f"><input id="e" type="email" placeholder="email" autocomplete="username"/></form>'
    +'<form id="g"><input id="p" type="password" placeholder="password" autocomplete="current-password"/>'
    +'<button class="plain" id="go">Sign in</button></form>'
    +'<p class="note '+(bad?"fail":"")+'" id="m">'+esc(msg||"")+'</p>';
  const go=()=>submit();
  document.getElementById("go").onclick=e=>{e.preventDefault();go()};
  document.getElementById("g").onsubmit=e=>{e.preventDefault();go()};
  document.getElementById("f").onsubmit=e=>{e.preventDefault();go()};
  async function submit(){
    const m=document.getElementById("m"); m.className="note"; m.textContent="Checking…";
    const r=await call(PATH,{action:"signin_password",
      email:document.getElementById("e").value.trim(),
      password:document.getElementById("p").value},false);
    if(r.status===200&&r.body.ok&&r.body.access_token){setTok(r.body.access_token);return boot()}
    gate(r.body.message||r.body.error||"That did not sign in.",true);
  }
}

async function boot(){
  if(!tok()) return gate("");
  root.innerHTML='<p class="standing quiet">Reading the studio…</p>';
  const r=await call(FN,{action:"brief"});
  if(r.status===401){setTok("");return gate("Your session ended. Sign in again.",true)}
  if(r.status!==200||!r.body.ok){
    root.innerHTML='<p class="standing">The studio could not be read.</p>'
      +'<p class="note fail">'+esc(r.body.error||("Failed ("+r.status+")"))+'</p>'
      +'<p class="note">That is a fault in this surface or its connection, not a statement '
      +'about the studio. Nothing below it should be read as holding.</p>';
    return;
  }
  B=r.body; paint();
}

const ago=iso=>{const d=(Date.now()-Date.parse(iso))/86400000;
  if(!isFinite(d))return"";
  if(d<1/24)return Math.round(d*1440)+" minutes ago";
  if(d<1)return Math.round(d*24)+" hours ago";
  return Math.round(d)+" days ago";};

function paint(){
  const t=new Date(B.as_of), hh=t.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
  const fails=B.failing||[], cov=B.coverage||{}, needs=B.needs_you||[];

  /* THE POSITIVE ASSERTION. Never an empty screen: what was examined, when, and how it
     stands. Anything failing is named here rather than waiting to be asked for. */
  let standing;
  if(!fails.length){
    standing='<span class="mark m-holds"></span>'+B.examined+' things checked at '
      +esc(hh)+', all hold.';
  }else{
    standing='<span class="mark m-fails"></span>'+B.examined+' things checked at '+esc(hh)+', '
      +B.holding+' hold. '+fails.map(f=>esc(f.what)).join(", and ")+'.';
  }

  root.innerHTML=
    '<p class="standing">'+standing+'</p>'
  + '<p class="note">'+esc(cov.says||"")+'</p>'

  + (fails.length
     ? '<section><h2>What is failing</h2>'
       + fails.map(f=>'<div class="item"><div class="row"><span class="what">'+esc(f.what)+'</span>'
           +'<span class="value">'+esc(f.value)+'</span></div>'
           +'<p>'+esc(f.means)+'</p></div>').join("")
       + '</section>'
     : '')

  + '<section><h2>What needs you</h2>'
  + (needs.length
     ? needs.map(n=>'<div class="item"><div class="row"><span class="what">'+esc(n.item)+'</span>'
         +'<span class="value">'+esc(n.since)+'</span></div>'
         + (n.fix?'<p>'+esc(n.fix)+'</p>':'<p>No next step recorded, which is why it is here.</p>')
         +'</div>').join("")
     : '<p class="quiet">Nothing is waiting on you.</p>')
  + '<p class="note">'+esc(B.needs_you_rule||"")+'</p>'
  + '</section>'

  + '<section><h2>Ask the record</h2>'
  + '<form id="askf"><input id="q" placeholder="Ask anything about the studio"/>'
  +   '<button class="plain" id="askb">Ask</button></form>'
  + '<p class="note">The twelve things this screen used to show are all still measured. '
  +   'Ask for any of them: what is stale, what the machinery is doing, what is in the '
  +   'parts bin, what contradicts what.</p>'
  + '<div id="out"></div>'
  + '</section>'

  + '<hr/>'
  + '<section><h2>Everything examined</h2>'
  + (B.all_checks||[]).map(c=>'<div class="item"><div class="row">'
      +'<span class="what"><span class="mark '+(c.holds?"m-holds":"m-fails")+'"></span>'+esc(c.what)+'</span>'
      +'<span class="value">'+esc(c.value)+'</span></div>'
      +'<p>'+esc(c.means)+'</p></div>').join("")
  + '<p class="note">Checked when this page was drawn, '+esc(hh)+'. Nothing here is stored; '
  +   'each line is read from source every time the screen loads.</p>'
  + '</section>';

  const f=document.getElementById("askf");
  f.onsubmit=e=>{e.preventDefault();ask()};
  document.getElementById("askb").onclick=e=>{e.preventDefault();ask()};
}

/* Two shortcuts that are workflows rather than readouts, so they open rather than answer. */
async function ask(){
  const q=document.getElementById("q").value.trim(); if(!q) return;
  const out=document.getElementById("out");
  out.innerHTML='<p class="note">Reading…</p>';

  if(/\bpart|parts bin\b/i.test(q)) return showParts(out);
  if(/\bcontradic|conflict\b/i.test(q)) return showConflicts(out);

  const r=await call(FN,{action:"ask",q:q});
  if(r.status!==200||!r.body.ok){
    out.innerHTML='<p class="note fail">'+esc((r.body&&r.body.error)||("Failed ("+r.status+")"))+'</p>';
    return;
  }
  const d=r.body, groups=[["decisions",d.decisions],["open items",d.open_items],
                          ["promises",d.promises],["dissolved",d.dissolved]];
  const any=groups.some(g=>(g[1]||[]).length);
  out.innerHTML = any
    ? groups.filter(g=>(g[1]||[]).length).map(g=>
        '<div class="answer"><h2>'+esc(g[0])+'</h2>'
        + g[1].slice(0,6).map(x=>'<div class="item">'+esc(x.what||x.item||x.promise||x.stands||"")
            +'<div class="src">'+esc(x.on||x.raised||x.verdict||"")+'</div></div>').join("")
        +'</div>').join("")
    : '<p class="note">Nothing in the record matches that. '+esc(d.how||"")+'</p>';
}

async function showParts(out){
  const r=await call(FN,{action:"parts"});
  if(r.status!==200||!r.body.ok){out.innerHTML='<p class="note fail">Could not read the parts.</p>';return}
  const d=r.body;
  out.innerHTML='<div class="answer"><p>'+esc(d.total)+' parts, grouped as they were built.</p>'
    +'<p class="note">'+esc(d.empty_state)+'</p>'
    + (d.lenses||[]).map(l=>'<h2>'+esc(String(l.lens).replace(/_/g," "))+'</h2>'
        + (l.parts||[]).map(p=>'<div class="item"><div class="row">'
            +'<span class="what">'+esc(p.name)+'</span>'
            +'<span class="value">'+esc(p.aliveness)+'</span></div>'
            +'<p>'+esc(p.one_liner||p.what_it_is||"")+'</p>'
            +'<details><summary>Why it matters</summary><p>'+esc(p.why_it_matters||"")+'</p>'
            +'<p class="note">'+esc(p.aliveness_means)+'</p></details>'
            +'</div>').join("")).join("")
    +'<p class="note">'+esc((d.product_specific||{}).why||"")+'</p></div>';
}

async function showConflicts(out){
  const r=await call(FN,{action:"conflicts",scope:"cross"});
  if(r.status!==200||!r.body.ok){out.innerHTML='<p class="note fail">Could not read the queue.</p>';return}
  const d=r.body,c=d.counts||{};
  out.innerHTML='<div class="answer"><p>'+esc(c.in_scope)+' pairs across two documents are waiting on a ruling, '
    +esc(c.intra_doc)+' more inside a single document.</p>'
    +'<p class="note">'+esc(d.means||"")+'</p>'
    + (d.items||[]).slice(0,8).map(p=>'<div class="item"><div class="row">'
        +'<span class="what">'+esc(p.a_doc)+' against '+esc(p.b_doc)+'</span>'
        +'<span class="value">'+(p.has_direction?"a side suggested":"no suggestion")+'</span></div>'
        +'<p>'+esc(p.a_heading)+'</p></div>').join("")
    +'<p class="note">Ruling on these needs the full text of both passages, which is a page '
    +'of its own rather than an answer here.</p></div>';
}

boot();
</script>
</body>
</html>
