<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>The studio</title>
<!--
  THE STUDIO SURFACE, rebuilt as an instrument.

  THE FAULT WAS CONTENT SHAPE, NOT STYLING. This page rendered database rows verbatim —
  decision bodies of two thousand characters, stacked. Four briefs treated that as a layout
  problem and each was executed correctly; the page stayed unreadable because nothing ever
  changed what a row IS. So: one line per item, always. Headline, date, status, in aligned
  columns the eye runs down. The body is fetched only when a row is opened, and it opens in
  a panel beside the list rather than pushing the page down.

  THE HEADER NEVER SCROLLS AWAY: what was checked, what holds, and the coverage at the same
  size as the count. An alert band appears beneath it only when something fails. Its absence
  is meaningful precisely because the line above always states what was examined — a blank
  space would be ambiguous, a stated count is not.

  Four tabs named for why you came, each opening with a fixed explanation box that is always
  visible rather than a hover.
-->
<style>
  :root{
    --paper:#FAF9F6; --panel:#F0EDE6; --ink:#1A1A18; --second:#4A4D52;
    --rule:#D5D1C7; --holds:#2E6B3C; --fails:#A32219; --alert:#FBEBE9; --unknown:#8A6A1F;
    --prose:Georgia,"Iowan Old Style","Times New Roman",serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--paper);color:var(--ink);font-family:var(--prose);font-size:18px;line-height:1.6}

  /* the header never scrolls away */
  header{position:sticky;top:0;z-index:10;background:var(--panel);
         border-bottom:1px solid var(--rule)}
  .hbar{max-width:76rem;margin:0 auto;padding:.9rem 1.5rem;display:flex;flex-wrap:wrap;
        gap:.4rem 2rem;align-items:baseline}
  .gauge{font-size:20px;font-family:var(--mono);font-variant-numeric:tabular-nums}
  .cov{font-size:20px;color:var(--ink)}
  .cov b{font-family:var(--mono);font-weight:400}
  .alert{background:var(--alert);border-bottom:1px solid var(--fails)}
  .alert div{max-width:76rem;margin:0 auto;padding:.7rem 1.5rem;color:var(--fails);font-size:18px}
  .alert p{margin:.15rem 0;max-width:none}

  nav{max-width:76rem;margin:0 auto;padding:0 1.5rem;display:flex;gap:.3rem;
      border-bottom:2px solid var(--rule)}
  nav button{font:inherit;font-size:18px;color:var(--second);background:none;border:0;
    border-bottom:3px solid transparent;padding:.7rem 1rem;cursor:pointer;margin-bottom:-2px}
  nav button:hover{color:var(--ink)}
  nav button[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  main{max-width:76rem;margin:0 auto;padding:2rem 1.5rem 6rem;
       display:grid;grid-template-columns:minmax(0,1fr) 26rem;gap:2.5rem;align-items:start}
  @media (max-width:64rem){main{grid-template-columns:1fr}.detail{position:static!important}}

  .explain{background:var(--panel);border:1px solid var(--rule);border-radius:3px;
           padding:1.1rem 1.3rem;margin-bottom:2rem}
  .explain h2{font-size:26px;font-weight:700;margin-bottom:.4rem;border:0;padding:0}
  .explain p{font-size:17px;color:var(--ink);max-width:38rem;margin-top:.35rem}

  h2{font-size:26px;font-weight:700;padding-top:1.2rem;border-top:1px solid var(--rule);margin-bottom:.9rem}
  section{margin-top:2.4rem}
  .lede{color:var(--second);font-size:17px;margin-bottom:1rem;max-width:38rem}

  /* one line per item */
  .rows{border-top:1px solid var(--rule)}
  .r{display:grid;grid-template-columns:1fr 7rem 8rem;gap:1.2rem;align-items:baseline;
     padding:.65rem .3rem;border-bottom:1px solid var(--rule);cursor:pointer;
     background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;font:inherit}
  .r:hover{background:var(--panel)}
  .r[aria-current="true"]{background:var(--panel);font-weight:700}
  .r .h{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .r .d,.r .s{font-family:var(--mono);font-size:16px;color:var(--second);
              text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;
              overflow:hidden;text-overflow:ellipsis}
  .r .act{grid-column:1/-1;font-size:16px;color:var(--second);margin-top:.15rem;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .r .none{grid-column:1/-1;font-size:16px;color:var(--fails);margin-top:.15rem}
  @media (max-width:44rem){.r{grid-template-columns:1fr 7rem}.r .s{display:none}}

  .detail{position:sticky;top:7rem;background:var(--panel);border:1px solid var(--rule);
          border-radius:3px;padding:1.3rem;max-height:calc(100vh - 9rem);overflow:auto}
  .detail h3{font-size:20px;font-weight:700;margin-bottom:.5rem}
  .detail .meta{font-family:var(--mono);font-size:16px;color:var(--second);margin-bottom:.9rem}
  .detail .body{white-space:pre-wrap;font-size:17px;line-height:1.62}
  .detail .close{font:inherit;font-size:16px;background:none;border:0;border-bottom:1px solid var(--rule);
                 cursor:pointer;color:var(--ink);margin-top:1rem;padding:0 0 2px}

  .tools{display:flex;flex-wrap:wrap;gap:.7rem;align-items:baseline;margin-bottom:1.1rem}
  input,select{font:inherit;font-size:17px;background:var(--paper);color:var(--ink);
    border:1px solid var(--rule);border-radius:2px;padding:.4rem .6rem}
  input[type=search]{min-width:16rem}
  .go{font:inherit;font-size:17px;background:none;border:0;border-bottom:1px solid var(--rule);
      padding:0 0 2px;cursor:pointer;color:var(--ink)}
  .note{font-size:16px;color:var(--second);margin-top:.8rem;max-width:38rem}
  .err{color:var(--fails)}
  .mark{display:inline-block;width:.55rem;height:.55rem;border-radius:50%;margin-right:.55rem;vertical-align:.08em}
  .m-holds{background:var(--holds)} .m-fails{background:var(--fails)}
  .gate{max-width:26rem;margin:6rem auto;padding:0 1.5rem}
  .gate form{display:flex;gap:.7rem;margin-top:.8rem}
</style>
</head>
<body>
<div id="app"></div>
<script>
const FN="https://yzsudnjwqplaaiwxbusi.supabase.co/functions/v1/studio-brief";
const PATH="https://yzsudnjwqplaaiwxbusi.supabase.co/functions/v1/studio-path";
const app=document.getElementById("app");
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tok=()=>{try{return localStorage.getItem("studio_token")||""}catch{return""}};
const setTok=t=>{try{t?localStorage.setItem("studio_token",t):localStorage.removeItem("studio_token")}catch{}};
let B=null,TAB=0,ROWS=null,OPEN=null,KIND="decisions",Q="",SINCE="",UNTIL="";

async function call(body,auth,url){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),25000);
  try{
    const r=await fetch(url||FN,{method:"POST",signal:c.signal,
      headers:Object.assign({"content-type":"application/json"},(auth!==false&&tok())?{authorization:"Bearer "+tok()}:{}),
      body:JSON.stringify(body)});
    const txt=await r.text();let j={};try{j=JSON.parse(txt)}catch{j={error:txt.slice(0,200)}}
    return{status:r.status,body:j};
  }catch(e){
    return{status:0,body:{error:(e&&e.name==="AbortError")?"No answer within 25 seconds.":"Could not reach the studio."}};
  }finally{clearTimeout(t)}
}

function gate(msg,bad){
  app.innerHTML='<div class="gate"><h2 style="border:0;padding:0">The studio</h2>'
    +'<form id="g"><input id="e" type="email" placeholder="email" autocomplete="username" style="flex:1"/></form>'
    +'<form id="h"><input id="p" type="password" placeholder="password" autocomplete="current-password" style="flex:1"/>'
    +'<button class="go">Sign in</button></form>'
    +'<p class="note '+(bad?"err":"")+'" id="m">'+esc(msg||"")+'</p></div>';
  const run=e=>{e.preventDefault();submit()};
  document.getElementById("g").onsubmit=run; document.getElementById("h").onsubmit=run;
  async function submit(){
    const m=document.getElementById("m");m.className="note";m.textContent="Checking…";
    const r=await call({action:"signin_password",email:document.getElementById("e").value.trim(),
      password:document.getElementById("p").value},false,PATH);
    if(r.status===200&&r.body.ok&&r.body.access_token){setTok(r.body.access_token);return boot()}
    gate(r.body.message||r.body.error||"That did not sign in.",true);
  }
}

async function boot(){
  if(!tok()) return gate("");
  app.innerHTML='<div class="gate"><p>Reading the studio…</p></div>';
  const r=await call({action:"brief"});
  if(r.status===401){setTok("");return gate("Your session ended. Sign in again.",true)}
  if(r.status!==200||!r.body.ok){
    app.innerHTML='<div class="gate"><h2 style="border:0;padding:0">The studio could not be read.</h2>'
      +'<p class="note err">'+esc(r.body.error||("Failed ("+r.status+")"))+'</p>'
      +'<p class="note">That is a fault in this surface or its connection, not a statement about '
      +'the studio. Nothing here should be read as holding.</p></div>';return;
  }
  B=r.body; paint(); if(TAB===1||TAB===2) load();
}

const TABS=[
  ["Now","What is failing and what is waiting on you. The daily read; it should be short.",
   "If the red band at the top is absent, nothing is failing — the header always says what was checked, so silence here is a reading rather than a gap."],
  ["Work","Everything still open, each with what to do about it where anything recorded a next step.",
   "Where a row shows no next step, that absence is the reason it needs you: nobody has decided what would resolve it."],
  ["Record","Decisions, promises, parts and contradictions — searchable.",
   "Nothing loads until you search or pick a type; the newest twenty are shown by default because 741 decisions are not browsable."],
  ["Movement","What changed since you were last here.",
   "Measured against your own last visit, not a fixed window. If nothing moved it says so, which is itself worth knowing."]
];

function header(){
  const t=new Date(B.as_of),hh=t.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
  const f=B.failing||[],cov=B.coverage||{};
  return '<header><div class="hbar">'
    + '<span class="gauge"><span class="mark '+(f.length?"m-fails":"m-holds")+'"></span>'
    +   esc(B.examined)+' checked · '+esc(B.holding)+' hold · '+esc(hh)+'</span>'
    + '<span class="cov"><b>'+esc(cov.checkers||0)+'</b> checker'+((cov.checkers||0)===1?"":"s")
    +   ' watching · <b>'+esc(cov.decisions_unmarked||0)+'</b> decisions unmarked</span>'
    + '</div>'
    + (f.length ? '<div class="alert"><div>'
        + f.map(x=>'<p>'+esc(x.what)+' — '+esc(x.value)+'</p>').join("")+'</div></div>' : '')
    + '<nav>'+TABS.map((t,i)=>'<button data-tab="'+i+'" role="tab" aria-selected="'+(i===TAB)+'">'
        +esc(t[0])+'</button>').join("")+'</nav></header>';
}

function explain(i){
  return '<div class="explain"><h2>'+esc(TABS[i][0])+'</h2><p>'+esc(TABS[i][1])+'</p>'
    +'<p>'+esc(TABS[i][2])+'</p></div>';
}

function rowsHtml(d){
  if(!d) return '<p class="note">Loading…</p>';
  if(d.error) return '<p class="note err">'+esc(d.error)+'</p>';
  if(!(d.rows||[]).length) return '<p class="note">Nothing matches.</p>';
  return (d.untitled>0?'<p class="note">'+esc(d.untitled)+' of these were recorded without a headline; '
          +'their first line is shown as written.</p>':'')
    + '<div class="rows">'+d.rows.map(r=>'<button class="r" data-open="'+esc(r.kind)+'|'+esc(r.id)+'"'
      + (OPEN&&OPEN.id===r.id?' aria-current="true"':'')+'>'
      + '<span class="h">'+esc(r.headline)+'</span>'
      + '<span class="d">'+esc(r.on||"")+'</span>'
      + '<span class="s">'+esc(r.status||"")+'</span>'
      + (r.next_action?'<span class="act">Next: '+esc(r.next_action)+'</span>'
         :(d.kind==='work'?'<span class="none">No next step recorded — that is why it needs you.</span>':''))
      + '</button>').join("")+'</div>'
    + '<p class="note">Showing '+esc(d.showing)+' of '+esc(d.total)+'.</p>';
}

function detail(){
  if(!OPEN) return '<aside class="detail"><h3>Nothing open</h3>'
    +'<p class="note">Click any row and its full text opens here, beside the list.</p></aside>';
  if(OPEN==="loading") return '<aside class="detail"><p class="note">Opening…</p></aside>';
  if(OPEN.error) return '<aside class="detail"><p class="note err">'+esc(OPEN.error)+'</p></aside>';
  return '<aside class="detail"><h3>'+esc(OPEN.kind)+'</h3>'
    +'<div class="meta">'+esc(String(OPEN.on||"").slice(0,10))+(OPEN.origin?' · '+esc(OPEN.origin):'')+'</div>'
    +'<div class="body">'+esc(OPEN.body||"")+'</div>'
    +'<button class="close" id="closed">Close</button></aside>';
}

function paint(){
  const mv=B.moved||{},needs=B.needs_you||[],cov=B.coverage||{};
  let left="";
  if(TAB===0){
    const f=B.failing||[];
    left=explain(0)
      +'<section style="margin-top:0"><h2>What is failing</h2>'
      +(f.length?'<div class="rows">'+f.map(x=>'<div class="r" style="cursor:default">'
          +'<span class="h">'+esc(x.what)+'</span><span class="d">'+esc(x.value)+'</span>'
          +'<span class="s">failing</span><span class="act">'+esc(x.means)+'</span></div>').join("")+'</div>'
        :'<p>Nothing is failing, out of '+esc(B.examined)+' things checked.</p>')
      +'</section>'
      +'<section><h2>What needs you</h2>'
      +(B.needs_you_note?'<p class="note">'+esc(B.needs_you_note)+'</p>':'')
      +(needs.length?'<div class="rows">'+needs.map(n=>'<div class="r" style="cursor:default">'
          +'<span class="h">'+esc(n.title||n.line)+'</span>'
          +'<span class="d">'+esc(n.since)+'</span><span class="s">'+esc(n.kind||"")+'</span>'
          +(n.title?'<span class="act">'+esc(n.line)+'</span>':'')+'</div>').join("")+'</div>'
        :'<p>Nothing is waiting on you.</p>')
      +'</section>';
  } else if(TAB===1){
    left=explain(1)+'<div class="tools">'
      +'<input type="search" id="wq" placeholder="Search open work" value="'+esc(Q)+'"/>'
      +'<button class="go" id="wgo">Search</button></div>'+rowsHtml(ROWS);
  } else if(TAB===2){
    left=explain(2)+'<div class="tools">'
      +'<select id="kind">'+["decisions","promises","parts","contradictions"].map(k=>
          '<option value="'+k+'"'+(KIND===k?' selected':'')+'>'+k+'</option>').join("")+'</select>'
      +'<input type="search" id="q" placeholder="Search text" value="'+esc(Q)+'"/>'
      +'<input type="date" id="since" value="'+esc(SINCE)+'" aria-label="from"/>'
      +'<input type="date" id="until" value="'+esc(UNTIL)+'" aria-label="to"/>'
      +'<button class="go" id="qgo">Search</button></div>'+rowsHtml(ROWS);
  } else {
    const since=mv.since?(mv.since_is_real_visit
        ?'Since you were last here, '+new Date(mv.since).toLocaleDateString([],{weekday:"long",day:"numeric",month:"long"})+'.'
        :'Over the last seven days — this is your first recorded visit, so there is no last-visit mark yet.'):'';
    left=explain(3)+'<p class="lede">'+esc(since)+'</p>'
      +(mv.error?'<p class="note err">This could not be read, so it is unknown rather than nothing.</p>'
        :(mv.nothing_moved?'<p>'+esc(mv.says)+'</p>'
          :'<div class="rows">'+(mv.moved||[]).map(m=>'<div class="r" style="cursor:default">'
              +'<span class="h">'+esc(m.what)+'</span><span class="d">'+esc(m.n)+'</span><span class="s"></span>'
              +(m.grain?'<span class="act">'+esc(m.grain)+'</span>':'')+'</div>').join("")+'</div>'))
      +'<section><h2>The debt</h2><div class="rows"><div class="r" style="cursor:default">'
      +'<span class="h">Decisions with no record of being carried out</span>'
      +'<span class="d">'+esc(mv.debt_now!=null?mv.debt_now:cov.decisions_unmarked)+'</span><span class="s"></span>'
      +'<span class="act">'+esc(mv.debt_note||"")+'</span></div></div></section>';
  }
  app.innerHTML=header()+'<main><div>'+left+'</div>'+detail()+'</main>';
  bind();
}

function bind(){
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{
    TAB=+b.dataset.tab;ROWS=null;OPEN=null;
    if(TAB===1){KIND="work";Q="";}
    if(TAB===2){KIND="decisions";Q="";}
    paint(); if(TAB===1||TAB===2) load();
  });
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{
    const [k,id]=b.dataset.open.split("|");openRow(k,id);
  });
  const c=document.getElementById("closed"); if(c) c.onclick=()=>{OPEN=null;paint()};
  const wgo=document.getElementById("wgo");
  if(wgo) wgo.onclick=()=>{Q=document.getElementById("wq").value.trim();ROWS=null;paint();load()};
  const qgo=document.getElementById("qgo");
  if(qgo) qgo.onclick=()=>{
    KIND=document.getElementById("kind").value;
    Q=document.getElementById("q").value.trim();
    SINCE=document.getElementById("since").value;
    UNTIL=document.getElementById("until").value;
    ROWS=null;paint();load();
  };
}

async function load(){
  const r=await call({action:"rows",kind:KIND,q:Q,since:SINCE||null,until:UNTIL||null,limit:20});
  ROWS=(r.status===200&&r.body.ok)?r.body:{error:(r.body&&r.body.error)||("Failed ("+r.status+")")};
  paint();
}

async function openRow(kind,id){
  OPEN="loading";paint();
  const r=await call({action:"row",kind:kind,id:id});
  OPEN=(r.status===200&&r.body&&r.body.ok!==false)?r.body
     :{error:(r.body&&r.body.error)||("Could not open it ("+r.status+")")};
  paint();
}

boot();
</script>
</body>
</html>
