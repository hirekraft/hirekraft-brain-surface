<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Your mail — HireKraft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c2430; --ink-2:#3a4655; --muted:#66727f; --muted-2:#95a0ac;
    --paper:#ffffff; --canvas:#f4f6f8; --line:#e4e8ec; --line-2:#eef1f4;
    --rail:#f7f5f1; --rail-line:#e9e3d9;
    --held:#2f7d6b; --held-bg:#e9f4f0; --held-line:#cfe6dd;
    --amber:#b0752a; --amber-bg:#fbf3e6; --amber-line:#eeddc0;
    --sky:#356f97; --sky-bg:#eaf1f6; --sky-line:#cfe0ec;
    --violet:#6a5bb0; --violet-bg:#efedf8; --violet-line:#d9d3ee;
    --radius:14px;
    --shadow:0 1px 2px rgba(20,24,29,.04), 0 12px 30px -20px rgba(20,24,29,.22);
    --serif:'Fraunces',Georgia,serif; --sans:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--canvas);-webkit-font-smoothing:antialiased}
  .wrap{display:grid;grid-template-columns:340px 1fr;min-height:100vh}
  a{color:inherit}

  /* ---------- consultant rail (carried from the filling lens) ---------- */
  .rail{background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .rail-head{padding:24px 24px 6px}
  .consultant-badge{display:flex;align-items:center;gap:11px}
  .orb{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 42% 38%,#4a9a84,var(--held));box-shadow:0 0 0 0 rgba(47,125,107,.36);animation:breathe 3.4s ease-in-out infinite;flex:none}
  @keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(47,125,107,.30)}50%{box-shadow:0 0 0 7px rgba(47,125,107,0)}}
  .consultant-badge .who{font-family:var(--serif);font-weight:600;font-size:16px;letter-spacing:.01em}
  .consultant-badge .role{font-size:11px;color:var(--muted-2);font-family:var(--mono);letter-spacing:.03em}
  .speech{padding:8px 24px 0;flex:1;overflow-y:auto}
  .say{font-family:var(--serif);font-size:17.5px;line-height:1.5;color:var(--ink);margin:16px 0;opacity:0;transform:translateY(6px);animation:rise .5s ease forwards}
  .say.small{font-family:var(--sans);font-size:14px;color:var(--ink-2);line-height:1.55}
  .say b{font-weight:600;color:var(--held)}
  @keyframes rise{to{opacity:1;transform:none}}
  .backlink{display:inline-flex;align-items:center;gap:6px;margin:14px 24px 0;font-size:12.5px;color:var(--muted);text-decoration:none;font-family:var(--mono)}
  .backlink:hover{color:var(--held)}
  .ask{padding:16px 20px 20px;border-top:1px solid var(--line)}
  .ask label{font-size:11px;color:var(--muted-2);font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase}
  .ask .box{margin-top:8px;display:flex;gap:8px;align-items:flex-end;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 12px}
  .ask textarea{border:0;resize:none;outline:none;flex:1;font-family:inherit;font-size:14px;color:var(--ink);background:transparent;line-height:1.45;max-height:120px}
  .ask .send{flex:none;width:34px;height:34px;border-radius:9px;border:0;background:var(--held);color:#fff;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center}
  .sovereign{margin:0 24px 12px;display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--held);background:var(--held-bg);border:1px solid var(--held-line);border-radius:20px;padding:5px 13px}

  /* identity route — shown on screen, never silent (spec item g) */
  .route{margin:8px 24px 16px;font-family:var(--mono);font-size:11px;line-height:1.5;border-radius:10px;padding:8px 11px;border:1px solid var(--line);background:var(--paper);color:var(--muted)}
  .route .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:middle}
  .route.jwt{border-color:var(--held-line);background:var(--held-bg);color:var(--held)}
  .route.jwt .dot{background:var(--held)}
  .route.asserted{border-color:var(--amber-line);background:var(--amber-bg);color:var(--amber)}
  .route.asserted .dot{background:var(--amber)}
  .route a{color:inherit;text-decoration:underline}

  /* ---------- canvas ---------- */
  .canvas{padding:26px 30px 120px;max-width:1220px}
  .head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:4px}
  h1{font-family:var(--serif);font-weight:600;font-size:27px;margin:0;letter-spacing:-.01em}
  .sub{font-size:13px;color:var(--muted);margin-top:5px}
  .mono{font-family:var(--mono)}

  /* three-state toggle */
  .toggle{display:inline-flex;margin-top:16px;background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
  .toggle button{border:0;background:none;font-family:inherit;font-size:13px;color:var(--muted);padding:7px 15px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:7px}
  .toggle button .c{font-family:var(--mono);font-size:11px;color:var(--muted-2);background:var(--canvas);border-radius:20px;padding:1px 7px;min-width:20px;text-align:center}
  .toggle button.on{background:var(--held-bg);color:var(--held);box-shadow:inset 0 0 0 1px var(--held-line)}
  .toggle button.on .c{background:#fff;color:var(--held)}

  /* filter_applied proof band — the inbox looking like the inbox (spec item a) */
  .proof{margin-top:14px;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--held);background:var(--held-bg);border:1px solid var(--held-line);border-radius:10px;padding:9px 13px;line-height:1.45}
  .proof svg{flex:none;width:15px;height:15px}
  .proof .q{font-family:var(--mono);font-size:11px;color:var(--ink-2);background:#fff;border:1px solid var(--held-line);border-radius:6px;padding:1px 7px}
  .proof.search{color:var(--sky);background:var(--sky-bg);border-color:var(--sky-line)}
  .proof.search .q{border-color:var(--sky-line)}

  .panes{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:18px;margin-top:16px;align-items:start}
  .panes.solo{grid-template-columns:minmax(0,1fr)}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .card-head{padding:14px 16px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;justify-content:space-between;gap:10px}
  .card-head h2{font-family:var(--serif);font-size:16px;font-weight:600;margin:0}
  .card-head .meta{font-size:11.5px;color:var(--muted-2);font-family:var(--mono)}

  /* inbox list */
  .msg{padding:12px 16px;border-bottom:1px solid var(--line-2);cursor:pointer;transition:background .12s;position:relative}
  .msg:last-child{border-bottom:0}
  .msg:hover{background:var(--canvas)}
  .msg.active{background:var(--held-bg);box-shadow:inset 3px 0 0 var(--held)}
  .msg .r1{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
  .msg .who{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .msg .when{font-size:11px;color:var(--muted-2);white-space:nowrap;font-family:var(--mono)}
  .msg .subj{font-size:13.5px;margin-top:2px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .msg .snip{font-size:12px;color:var(--muted-2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .msg.unread .who::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--held);margin-right:7px;vertical-align:middle}
  .msg .loop{margin-top:6px;display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-family:var(--mono);padding:2px 8px;border-radius:20px;border:1px solid var(--sky-line);background:var(--sky-bg);color:var(--sky)}
  .msg .loop.resolved{border-color:var(--held-line);background:var(--held-bg);color:var(--held)}
  .msg .gcat{font-size:10px;font-family:var(--mono);color:var(--muted-2);border:1px solid var(--line);border-radius:20px;padding:1px 7px;margin-left:6px}

  .loadmore{padding:14px 16px;text-align:center}
  .loadmore .btn{width:100%}

  /* revelation-first open */
  .reveal{padding:16px}
  .reveal .lead{font-family:var(--serif);font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--held);margin:0 0 8px}
  .reveal .didnt{font-family:var(--serif);font-size:18px;line-height:1.5;color:var(--ink);margin:0 0 6px}
  .reveal .conf{font-size:12px;color:var(--muted);font-style:italic;line-height:1.5}
  .stands{margin:16px 16px 0;padding:12px 14px;background:var(--canvas);border:1px solid var(--line);border-radius:12px}
  .stands .lead{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-2);margin:0 0 5px}
  .stands p{margin:0;font-size:13.5px;line-height:1.55;color:var(--ink-2)}
  .reach{margin-top:8px;font-size:12px;color:var(--amber);line-height:1.5}

  /* suggested actions + three-way primitive */
  .actions{margin:14px 16px 0;display:flex;gap:8px;flex-wrap:wrap}
  .act{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 13px;font-family:inherit;font-size:13px;color:var(--ink-2);cursor:pointer;display:flex;align-items:center;gap:8px}
  .act:hover{border-color:var(--held-line);color:var(--held)}
  .act .k{font-family:var(--mono);font-size:10px;color:var(--muted-2)}
  .act.primary{background:var(--held);border-color:var(--held);color:#fff}
  .act.primary .k{color:rgba(255,255,255,.7)}
  .openbox{margin:12px 16px 4px;display:flex;gap:8px;align-items:flex-end;background:var(--canvas);border:1px solid var(--line);border-radius:12px;padding:9px 9px 9px 13px}
  .openbox textarea{border:0;resize:none;outline:none;flex:1;font-family:inherit;font-size:13.5px;color:var(--ink);background:transparent;line-height:1.45;max-height:120px}
  .openbox .send{flex:none;width:32px;height:32px;border-radius:9px;border:0;background:var(--ink);color:#fff;cursor:pointer;font-size:14px}

  /* thread */
  .m-body{padding:8px 16px 14px}
  .mail{border-bottom:1px solid var(--line-2);padding:12px 0}
  .mail:last-child{border-bottom:0}
  .mail .mh{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .mail .mfrom{font-weight:600;font-size:13.5px}
  .mail .mdate{font-size:11px;color:var(--muted-2);font-family:var(--mono)}
  .mail .mto{font-size:11.5px;color:var(--muted-2);margin-top:2px}
  .mail .mtext{font-size:13.5px;line-height:1.6;color:var(--ink-2);margin-top:9px;white-space:pre-wrap;word-break:break-word;max-height:280px;overflow:auto}
  .thread-toggle{margin:10px 16px 0;font-size:12px;color:var(--muted);cursor:pointer;font-family:var(--mono);display:inline-flex;align-items:center;gap:6px}
  .thread-toggle:hover{color:var(--held)}

  /* case file / solutions */
  .assembling{padding:22px 16px;text-align:center;color:var(--muted);font-family:var(--serif);font-size:16px}
  .dots span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--held);margin:0 2px;animation:bounce 1.2s infinite}
  .dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
  @keyframes bounce{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
  .grp{padding:11px 16px 4px;font-size:11px;font-family:var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted-2)}
  .item{display:block;padding:11px 16px;border-bottom:1px solid var(--line-2);text-decoration:none;color:inherit;transition:background .12s}
  .item:hover{background:var(--canvas)}
  .item .r1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .item .t{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .d{font-size:11px;color:var(--muted-2);font-family:var(--mono);white-space:nowrap}
  .item .s{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .tags{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .pill{font-size:10.5px;font-family:var(--mono);padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--muted);background:var(--canvas)}
  .pill.why{background:var(--sky-bg);border-color:var(--sky-line);color:var(--sky)}
  .pill.tier{background:var(--violet-bg);border-color:var(--violet-line);color:var(--violet)}
  .pill.open{color:var(--held);border-color:var(--held-line);background:var(--held-bg)}
  .item .reg{margin-top:7px}
  .miniact{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:4px 10px;font-family:var(--mono);font-size:10.5px;color:var(--muted);cursor:pointer}
  .miniact:hover{border-color:var(--held-line);color:var(--held)}

  /* provenance */
  .prov{margin-top:6px;font-size:11px;color:var(--muted-2);font-family:var(--mono);cursor:pointer;display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:0}
  .prov:hover{color:var(--held)}
  .prov .dot{width:6px;height:6px;border-radius:50%;flex:none}
  .prov .dot.physics{background:var(--held)}
  .prov .dot.chokepoint{background:var(--violet)}
  .prov-detail{display:none;margin-top:7px;font-size:11.5px;line-height:1.5;color:var(--ink-2);background:var(--canvas);border:1px solid var(--line);border-left:2px solid var(--held);border-radius:8px;padding:8px 10px}
  .prov-detail.chokepoint{border-left-color:var(--violet)}
  .prov-detail.show{display:block}

  .note{margin:14px 16px 0;background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
  .note h3{font-family:var(--serif);font-size:14.5px;margin:0 0 5px;font-weight:600}
  .note p{margin:0;font-size:13px;line-height:1.55;color:var(--ink-2)}
  .note em{font-style:italic}
  .empty{padding:30px 16px;text-align:center;color:var(--muted-2);font-size:13.5px;line-height:1.6}
  .err{border-left-color:#b0452a}
  .btn{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:6px 12px;font-family:inherit;font-size:12.5px;color:var(--ink-2);cursor:pointer}
  .btn:hover{border-color:var(--held-line);color:var(--held)}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  .btn[disabled]:hover{border-color:var(--line);color:var(--ink-2)}

  /* case workspace */
  .ws{padding:0}
  .ws-top{padding:16px;border-bottom:1px solid var(--line-2)}
  .ws-top .name{font-family:var(--serif);font-size:19px;font-weight:600;line-height:1.35}
  .ws-top .sit{margin-top:7px;font-size:13.5px;color:var(--ink-2);line-height:1.55}
  .ws-status{margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .chip{font-family:var(--mono);font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid var(--line);color:var(--muted);background:var(--canvas);cursor:pointer}
  .chip.on{border-color:var(--held-line);background:var(--held-bg);color:var(--held)}
  .parent{margin:10px 16px 0;font-size:12px;color:var(--muted);font-family:var(--mono)}

  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(20,24,29,.32);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .modal-bg.on{display:flex}
  .modal{background:var(--paper);border-radius:16px;box-shadow:0 24px 60px -20px rgba(20,24,29,.5);width:100%;max-width:460px;padding:22px}
  .modal h3{font-family:var(--serif);font-size:19px;font-weight:600;margin:0 0 4px}
  .modal .hint{font-size:13px;color:var(--muted);margin:0 0 16px;line-height:1.5}
  .modal label{font-size:11px;font-family:var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted-2);display:block;margin:14px 0 6px}
  .modal input,.modal textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:inherit;font-size:14px;color:var(--ink);outline:none;resize:none}
  .modal input:focus,.modal textarea:focus{border-color:var(--held)}
  .modal .propose{margin-top:12px;font-size:12.5px;color:var(--sky);background:var(--sky-bg);border:1px solid var(--sky-line);border-radius:10px;padding:10px 12px;line-height:1.5;cursor:pointer}
  .modal-actions{margin-top:20px;display:flex;gap:10px;justify-content:flex-end}
  .modal-actions .btn.primary{background:var(--held);border-color:var(--held);color:#fff}

  @media (max-width:1080px){.wrap{grid-template-columns:1fr}.rail{position:static;height:auto}.panes{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <aside class="rail">
    <div class="rail-head">
      <div class="consultant-badge">
        <div class="orb"></div>
        <div>
          <div class="who">Your consultant</div>
          <div class="role">MAIL LENS</div>
        </div>
      </div>
    </div>
    <a class="backlink" href="../fill/">← back to your brain</a>
    <div class="speech" id="speech"></div>
    <div class="sovereign" id="sov">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <span id="sovLine">We read this as you — nothing is copied</span>
    </div>
    <div class="route" id="route"><span class="dot"></span><span id="routeText">Checking how you're signed in…</span></div>
    <div class="ask">
      <label>Ask us anything</label>
      <div class="box">
        <textarea id="askBox" rows="1" placeholder="What's the story with Diconium?"></textarea>
        <button class="send" id="askSend">↑</button>
      </div>
    </div>
  </aside>

  <main class="canvas">
    <div class="head">
      <div>
        <h1 id="title">Your mail</h1>
        <div class="sub" id="sub">Opening the mailbox…</div>
      </div>
      <button class="btn" id="composeBtn" disabled title="Replying needs your permission to write — we don't have it yet, and we won't take it quietly.">Draft a reply</button>
    </div>

    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <div class="toggle" id="toggle" style="display:none">
        <button data-view="inbox" class="on">Inbox <span class="c" id="cInbox">·</span></button>
        <button data-view="loops">Open loops <span class="c" id="cLoops">·</span></button>
        <button data-view="resolved">Resolved <span class="c" id="cResolved">·</span></button>
      </div>
      <button class="btn" id="casesBtn" style="display:none;margin-top:16px">Cases <span class="mono" id="cCases" style="font-size:11px;color:var(--muted-2)"></span></button>
    </div>

    <div id="stage"></div>
  </main>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal" id="modal"></div>
</div>

<script type="module" src="./mail.js"></script>
</body>
</html>
